name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependencias
        run: dotnet restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Tests
        run: dotnet test --no-build --configuration Release --logger "console;verbosity=normal"

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Linter
        run: npm run lint

      - name: Tipos y build de producción
        run: npm run build

  base-de-datos:
    name: Scripts de base de datos (SQL Server)
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Ci-Password-123   # contenedor efímero, solo existe durante este job
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Password-123' -Q 'SELECT 1' -b"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7

      - name: Crear esquema y cargar datos demo
        env:
          CONTENEDOR: ${{ job.services.sqlserver.id }}
        run: |
          docker cp database/. "$CONTENEDOR":/tmp/database
          sqlcmd() { docker exec "$CONTENEDOR" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Password-123' -b -f 65001 "$@"; }
          sqlcmd -i /tmp/database/00_crear_base.sql
          sqlcmd -d CompraTrack -i /tmp/database/01_esquema.sql
          sqlcmd -d CompraTrack -i /tmp/database/02_datos_demo.sql

      - name: Verificar los datos cargados
        env:
          CONTENEDOR: ${{ job.services.sqlserver.id }}
        run: |
          docker exec "$CONTENEDOR" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Ci-Password-123' -d CompraTrack -b -Q "
            SET NOCOUNT ON;
            IF (SELECT COUNT(*) FROM dbo.OrdenCompra) <> 60 THROW 50000, 'Se esperaban 60 órdenes', 1;
            IF NOT EXISTS (SELECT 1 FROM dbo.vw_EstadoEntregaItem WHERE EstadoEntrega = 'ENTREGA PARCIAL') THROW 50000, 'Faltan entregas parciales', 1;
            IF EXISTS (SELECT 1 FROM dbo.Recepcion WHERE Fecha > CAST(GETDATE() AS DATE)) THROW 50000, 'Hay recepciones con fecha futura', 1;
            SELECT 'OK' AS Resultado;"

  docker:
    name: Docker Compose (app completa)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Levantar base, API y frontend
        run: docker compose up --build -d

      - name: Probar la app a través de Nginx
        run: |
          for intento in $(seq 1 60); do
            curl -fs -o /dev/null http://localhost:8080/ && break
            sleep 3
          done
          TOKEN=$(curl -fsS --retry 20 --retry-delay 3 --retry-all-errors -X POST http://localhost:8080/api/auth/login \
            -H 'Content-Type: application/json' -d '{"usuario":"compras","clave":"Demo1234!"}' | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          TOTAL=$(curl -fsS "http://localhost:8080/api/ordenes?tamanioPagina=1" -H "Authorization: Bearer $TOKEN" | jq .total)
          echo "Órdenes: $TOTAL" && test "$TOTAL" -eq 60
          curl -fsS http://localhost:8080/api/ordenes/55/pdf -H "Authorization: Bearer $TOKEN" -o orden.pdf
          head -c 5 orden.pdf | grep -q '%PDF-' && echo "PDF generado: $(stat -c %s orden.pdf) bytes"
          curl -fsS -o /dev/null http://localhost:8080/ordenes/55 && echo "Ruta del frontend OK"

      - name: Logs si algo falló
        if: failure()
        run: docker compose logs --no-color
