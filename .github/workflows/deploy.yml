name: Deploy demo

# Publica el demo en Azure cada vez que la CI pasa en main (o a mano desde la pestaña Actions).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-demo
  cancel-in-progress: false

jobs:
  api:
    name: API → Azure App Service
    # Se saltea hasta que el repo tenga configurados los recursos de Azure (variables y secretos).
    if: vars.AZURE_WEBAPP_NAME != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Publicar
        run: |
          dotnet publish src/backend/CompraTrack.Api -c Release -o publicacion
          cd publicacion && zip -qr ../api.zip .

      - uses: azure/login@v3
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Desplegar
        run: |
          az webapp deploy --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --src-path api.zip --type zip --restart true

      - name: Verificar que responde
        run: |
          for intento in $(seq 1 30); do
            if curl -fsS "${{ vars.API_URL }}/health"; then exit 0; fi
            sleep 10
          done
          echo "La API no respondió después del despliegue" && exit 1

  frontend:
    name: Frontend → Azure Static Web Apps
    if: vars.AZURE_WEBAPP_NAME != '' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/frontend/package-lock.json

      - name: Build
        working-directory: src/frontend
        env:
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          npm ci
          npm run build

      - name: Desplegar
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: src/frontend/dist
          skip_app_build: true
          skip_api_build: true
