# Sirve el frontend y reenvía /api a la API: el navegador ve un solo origen, así que no hace falta CORS.
server {
    listen 80;
    root /usr/share/nginx/html;

    # Los archivos de assets/ llevan un hash en el nombre: se pueden cachear para siempre.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Aplicación de una sola página: cualquier ruta (/ordenes/55, /reportes, …) carga index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
